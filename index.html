<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rustbucket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <canvas id="omniverse"></canvas>
    <script type="module">
        import * as THREE from 'three';

        const canvas = document.getElementById('omniverse');
        const omniverse = new THREE.Scene();
        omniverse.name = 'omniverse';
        omniverse.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            10000
        );
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true
        });
        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );
        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(omniverse, camera);
        }
        animate();
    </script>
</body>
</html>
