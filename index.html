<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#02040a" />
  <title>Rustbucket</title>
  <link rel="stylesheet" href="./screens/style.css" />
</head>
<body>
  <div id="game-root"></div>

  <script type="module">
    const root = document.getElementById("game-root");

    let activeScreen = null;
    let transitionInProgress = false;

    async function loadTitleScreen() {
      const response = await fetch("./screens/title.html");

      if (!response.ok) {
        throw new Error("Could not load title.html");
      }

      root.innerHTML = await response.text();

      const { initTitleScreen } = await import("./screens/title.js");
      activeScreen = initTitleScreen(root);
    }

    async function loadTutorialScreen() {
      if (transitionInProgress) return;
      transitionInProgress = true;

      try {
        if (activeScreen?.destroy) {
          activeScreen.destroy();
        }

        activeScreen = null;

        const response = await fetch("./screens/tutorial.html");

        if (!response.ok) {
          throw new Error("Could not load tutorial.html");
        }

        root.innerHTML = await response.text();

        const { initTutorialScreen } = await import("./screens/tutorial.js");
        activeScreen = initTutorialScreen(root);
      } catch (error) {
        console.error("Could not start the tutorial:", error);

        root.innerHTML = `
          <div class="game-error">
            <p>Unable to load the tutorial.</p>
            <button id="return-to-title" type="button">
              RETURN TO TITLE
            </button>
          </div>
        `;

        root.querySelector("#return-to-title")
          ?.addEventListener("click", async () => {
            transitionInProgress = false;
            await loadTitleScreen();
          });
      } finally {
        transitionInProgress = false;
      }
    }

    root.addEventListener("rustbucket:newgame", loadTutorialScreen);

    try {
      await loadTitleScreen();
    } catch (error) {
      console.error(error);

      root.innerHTML = `
        <div class="game-error">
          Unable to load Rustbucket. Run the game using a local web server.
        </div>
      `;
    }
  </script>
</body>
</html>
