<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rustbucket</title>
  <link rel="stylesheet" href="./screens/style.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    #omniverse { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="omniverse"></canvas>

  <script type="module">
    import * as THREE from "three";
    import { dimensions, state } from "./storage/state.js";
    import { createSun } from "./omniverse/sun.js";
    import { createEarth } from "./omniverse/earth.js";
    import { createMoon } from "./omniverse/moon.js";
    import { createTitleScreen } from "./hud/title.js";

    const canvas = document.getElementById("omniverse");
    const scene = new THREE.Scene();
    scene.name = "omniverse";
    scene.background = new THREE.Color(0x02040a);

    // All camera placement and drag tuning comes from state.js.
    const cameraConfig = dimensions.camera;
    const initialAspect = window.innerWidth / window.innerHeight;
    const camera = new THREE.PerspectiveCamera(
      initialAspect < 0.8 ? 75 : cameraConfig.fov,
      initialAspect,
      cameraConfig.near,
      cameraConfig.far
    );

    const cameraTarget = new THREE.Vector3(...cameraConfig.target);
    let cameraYaw = cameraConfig.initialYaw;
    let cameraPitch = cameraConfig.initialPitch;
    let cameraDistance = cameraConfig.distance;

    function updateCamera() {
      const horizontal = Math.cos(cameraPitch) * cameraDistance;
      camera.position.set(
        cameraTarget.x + Math.sin(cameraYaw) * horizontal,
        cameraTarget.y + Math.sin(cameraPitch) * cameraDistance,
        cameraTarget.z + Math.cos(cameraYaw) * horizontal
      );
      camera.lookAt(cameraTarget);
    }

    updateCamera();

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    // Title-space lighting and celestial models.
    scene.add(new THREE.AmbientLight(0x52617f, 0.45));
    const sunlight = new THREE.PointLight(0xffb65c, 1800, 160, 1.5);
    sunlight.position.set(...dimensions.sun.position);
    scene.add(sunlight);

    const { sun, sunAura, sunOuterGlow } = createSun(scene);
    const { earth } = createEarth(scene);
    const { moon } = createMoon(scene);

    // Starfield remains part of the shared Omniverse scene.
    const starCount = 6500;
    const starPositions = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const radius = 45 + Math.random() * 110;
      const theta = Math.random() * Math.PI * 2;
      const z = Math.random() * 2 - 1;
      const planar = Math.sqrt(1 - z * z);
      const brightness = 0.55 + Math.random() * 0.45;
      const blueStar = Math.random() > 0.84;
      starPositions[i * 3] = radius * planar * Math.cos(theta);
      starPositions[i * 3 + 1] = radius * z;
      starPositions[i * 3 + 2] = radius * planar * Math.sin(theta);
      starColors[i * 3] = brightness * (blueStar ? 0.65 : 1);
      starColors[i * 3 + 1] = brightness * (blueStar ? 0.82 : 1);
      starColors[i * 3 + 2] = brightness;
    }

    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
    starGeometry.setAttribute("color", new THREE.BufferAttribute(starColors, 3));
    const stars = new THREE.Points(
      starGeometry,
      new THREE.PointsMaterial({
        size: 0.12,
        sizeAttenuation: true,
        vertexColors: true,
        transparent: true,
        opacity: 0.95,
        depthWrite: false
      })
    );
    scene.add(stars);

    // Title controls are created by title.js, but shown only while stage === "title".
    const titleScreen = createTitleScreen({
      onNewGame() {
        state.stage = "tutorial";
      }
    });

    // Global title music. Browsers require a user gesture before playback.
    const music = new Audio("./hud/senji-v2-ov.mp3");
    music.loop = true;
    music.volume = 0.5;
    music.preload = "auto";
    let audioUnlocked = false;
    let activeStage = null;

    function unlockAudio() {
      audioUnlocked = true;
      if (state.stage === "title" && music.paused) {
        music.play().catch(error => console.warn("Title music playback failed:", error));
      }
      document.removeEventListener("pointerdown", unlockAudio);
      document.removeEventListener("keydown", unlockAudio);
    }
    document.addEventListener("pointerdown", unlockAudio, { once: true });
    document.addEventListener("keydown", unlockAudio, { once: true });

    // Dragging the canvas rotates the shared camera; there is no automatic orbit.
    let draggingCamera = false;
    let lastPointerX = 0;
    let lastPointerY = 0;
    canvas.style.touchAction = "none";

    function onPointerDown(event) {
      draggingCamera = true;
      lastPointerX = event.clientX;
      lastPointerY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    }

    function onPointerMove(event) {
      if (!draggingCamera) return;
      const dx = event.clientX - lastPointerX;
      const dy = event.clientY - lastPointerY;
      lastPointerX = event.clientX;
      lastPointerY = event.clientY;

      cameraYaw -= dx * cameraConfig.dragSensitivity;
      cameraPitch = THREE.MathUtils.clamp(
        cameraPitch + dy * cameraConfig.pitchSensitivity,
        cameraConfig.minPitch,
        cameraConfig.maxPitch
      );
      updateCamera();
    }

    function onPointerUp() {
      draggingCamera = false;
    }

    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerUp);

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.fov = window.innerWidth / window.innerHeight < 0.8 ? 75 : cameraConfig.fov;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    }
    window.addEventListener("resize", onResize);

    const clock = new THREE.Clock();
    let animationFrame = 0;

    function animate() {
      animationFrame = requestAnimationFrame(animate);

      const isTitle = state.stage === "title";
      titleScreen.setVisible(isTitle);

      if (activeStage !== state.stage) {
        activeStage = state.stage;
        if (activeStage === "title") {
          cameraTarget.set(...cameraConfig.target);
          cameraYaw = cameraConfig.initialYaw;
          cameraPitch = cameraConfig.initialPitch;
          cameraDistance = cameraConfig.distance;
          updateCamera();
          if (audioUnlocked) {
            music.play().catch(error => console.warn("Title music playback failed:", error));
          }
        } else {
          music.pause();
          music.currentTime = 0;
        }
      }

      const delta = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      if (isTitle) {
        earth.rotation.y += delta * 0.07;
        moon.rotation.y += delta * 0.04;
        sunAura.material.opacity = 0.11 + Math.sin(elapsed * 0.7) * 0.025;
        sunOuterGlow.material.opacity = 0.05 + Math.sin(elapsed * 0.45) * 0.012;
        stars.rotation.y += delta * 0.0008;
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("beforeunload", () => {
      cancelAnimationFrame(animationFrame);
      window.removeEventListener("resize", onResize);
      canvas.removeEventListener("pointerdown", onPointerDown);
      canvas.removeEventListener("pointermove", onPointerMove);
      canvas.removeEventListener("pointerup", onPointerUp);
      canvas.removeEventListener("pointercancel", onPointerUp);
      titleScreen.destroy();
      music.pause();
      renderer.dispose();
    }, { once: true });
  </script>
</body>
</html>
