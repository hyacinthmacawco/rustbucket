<main id="title-screen">
  <div id="space-background"></div>

  <section id="title-menu" aria-label="Main menu">
    <h1 id="game-title">RUSTBUCKET</h1>

    <div id="title-buttons">
      <button id="new-game-button" type="button">
        NEW GAME
      </button>

      <button
        id="load-game-button"
        type="button"
        aria-label="Load game"
        aria-expanded="false"
      >
        <span>LOAD GAME</span>

        <svg
          class="chevron"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          aria-hidden="true"
        >
          <path
            d="m6 9 6 6 6-6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>

    <div id="load-game-panel" hidden>
      <p>NO SAVED GAMES</p>
    </div>
  </section>
</main>
